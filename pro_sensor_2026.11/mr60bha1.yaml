#https://github.com/DuncanIdahoCT/espresence-mr60bha1-mmwave-sensor

substitutions:
  uart_id: "uart_bus_mr60bha1"
  mr24hpc1_id: "mr60bha1"
  mr24hpc1_prefix: "MR60BHA1 "
  distance_multiplier: .01

external_components:
  - source: custom_components
    components: [mr60bha1]


uart:
  id: ${uart_id}
  baud_rate:  115200
  rx_pin: 16
  tx_pin: 17

sensor:
mr60bha1:
  id: ${mr24hpc1_id}_ss
  uart_id: ${uart_id}
  heartstate:
    name: "${mr24hpc1_prefix}Heartrate State"
    state_class: measurement
  heartrate:
    name: "${mr24hpc1_prefix}Heartrate Level"
    state_class: measurement
  respstate:
    id: ${mr24hpc1_id}_respstate_sensor
    name: "internal_respstate_sensor_to_text_template"
    internal: true
    on_value_range:
      - above: 3.5
        below: 4.5
        then:
        - text_sensor.template.publish:
            id: ${mr24hpc1_id}_respstate_template
            state: "detecting"
      - above: 2.5
        below: 3.5
        then:
        - text_sensor.template.publish:
            id: ${mr24hpc1_id}_respstate_template
            state: "too low"
      - above: 1.5
        below: 2.5
        then:
        - text_sensor.template.publish:
            id: ${mr24hpc1_id}_respstate_template
            state: "too high"
      - above: 0.5
        below: 1.5
        then:
        - text_sensor.template.publish:
            id: ${mr24hpc1_id}_respstate_template
            state: "normal"
      - below: 0.5
        then:
        - text_sensor.template.publish:
            id: ${mr24hpc1_id}_respstate_template
            state: "none"
  resprate:
    name: ${mr24hpc1_prefix}Respiratory Rate
    state_class: measurement
  activity:
    name: ${mr24hpc1_prefix}Activity Level
    state_class: measurement
  distance:
    name: ${mr24hpc1_prefix}Distance (Meters)
    state_class: measurement
    accuracy_decimals: 1
    filters:
      multiply: ${distance_multiplier}
  angle_x:
    name: ${mr24hpc1_prefix}Angle X
    state_class: measurement
  angle_y:
    name: ${mr24hpc1_prefix}Angle Y
    state_class: measurement
  angle_z:
    name: ${mr24hpc1_prefix}Angle Z
    state_class: measurement
  presence:
    id: ${mr24hpc1_id}_presence_sensor
    name: "internal_presence_sensor_to_binary_template"
    internal: true
    on_value:
      - binary_sensor.template.publish:
          id: ${mr24hpc1_id}_presence_template
          state: !lambda return x > 0;
  motion:
    id: ${mr24hpc1_id}_motion_sensor
    name: "internal_motion_sensor_to_binary_template"
    internal: true
    on_value:
      - binary_sensor.template.publish:
          id: ${mr24hpc1_id}_motion_template
          state: !lambda return x > 0;
  
button:

  - platform: template
    name: ${mr24hpc1_prefix}Reset Module
    id: ${mr24hpc1_id}_reset_radar_module
    entity_category: diagnostic
    on_press:
      - uart.write: [0x53, 0x59, 0x01, 0x02, 0x00, 0x01, 0x0F, 0xBF, 0x54, 0x43]
      # just putting these placeholders here in case the frames are removed from documentation as has happened with other options
      # realtime_mode_frame
      # - uart.write: [0x53, 0x59, 0x84, 0x0F, 0x00, 0x01, 0x00, 0x40, 0x54, 0x43]
      # sleepstatus_mode_frame
      # - uart.write: [0x53, 0x59, 0x84, 0x0F, 0x00, 0x01, 0x01, 0x41, 0x54, 0x43]

binary_sensor:
  - platform: template
    id: ${mr24hpc1_id}_presence_template
    name: ${mr24hpc1_prefix}Presence
    device_class: occupancy
    filters:
      - delayed_off: 5s
  - platform: template
    id: ${mr24hpc1_id}_motion_template
    name: ${mr24hpc1_prefix}Motion
    device_class: motion

text_sensor:
  - platform: template
    id: ${mr24hpc1_id}_respstate_template
    name: ${mr24hpc1_prefix}Respiratory State