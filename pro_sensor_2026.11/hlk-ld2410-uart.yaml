# Default values; override per include with `vars:` if needed.
defaults:
  uart_id: "uart_bus_hlk_ld2410"
  ld2410_id: "hlk_ld2410"
  ld2410_prefix: "HLK-LD2410 "

uart:
  id: ${uart_id}
  rx_pin: 16
  tx_pin: 17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: ${ld2410_id}
  uart_id: ${uart_id}

binary_sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    has_target:
      name: Presence
      id: ${ld2410_id}_presence
      device_class: occupancy
      icon: mdi:home-outline
    has_moving_target:
      name: Motion
      id: ${ld2410_id}_motion
      device_class: motion
    has_still_target:
      name: Still
      id: ${ld2410_id}_still
      device_class: occupancy

number:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    timeout:
      name: ${ld2410_prefix}Presence delay
    max_move_distance_gate:
      name: ${ld2410_prefix}Max move distance gate
    max_still_distance_gate:
      name: ${ld2410_prefix}Max still distance gate

switch:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    bluetooth:
      name: ${ld2410_prefix}Bluetooth
    engineering_mode:
      name: ${ld2410_prefix}Engineering mode

select:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    distance_resolution:
      name: ${ld2410_prefix}Distance resolution
    baud_rate:
      name: ${ld2410_prefix}Baud rate

button:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    factory_reset:
      name: ${ld2410_prefix}Factory reset
    restart:
      name: ${ld2410_prefix}Restart
    query_params:
      name: ${ld2410_prefix}Query params

text_sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    version:
      name: ${ld2410_prefix}Firmware version
    mac_address:
      name: ${ld2410_prefix}MAC address

sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    moving_distance:
      name: ${ld2410_prefix}Moving Distance
    still_distance:
      name: ${ld2410_prefix}Still Distance
    moving_energy:
      name: ${ld2410_prefix}Move Energy
    still_energy:
      name: ${ld2410_prefix}Still Energy
    detection_distance:
      name: ${ld2410_prefix}Detection Distance
