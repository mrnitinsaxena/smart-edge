# Default values; override per include with `vars:` if needed.
defaults:
  mr24hpc1_id: "mr24hpc1" 
  mr24hpc1_prefix: "MR24HPC1 "

number:
  - platform: template
    name: ${mr24hpc1_prefix}Presence delay
    id: ${mr24hpc1_id}_presence_delay
    min_value: 1
    max_value: 60
    initial_value: 2
    optimistic: true
    step: 1
    restore_value: true
    unit_of_measurement: min
    icon: mdi:timer-edit-outline
    entity_category: config

binary_sensor:
  - platform: gpio
    pin:
      number: 26 # S1
      mode: INPUT
      inverted: false
    name: Presence
    id: ${mr24hpc1_id}_presence
    device_class: occupancy
    filters:
      - delayed_on: 0s
      - delayed_off: !lambda "return id(${mr24hpc1_id}_presence_delay).state * 60000;"

  - platform: gpio
    pin:
      number: 27 # S2
      mode: INPUT
      inverted: false
    name: Motion
    id: ${mr24hpc1_id}_motion
    device_class: motion
