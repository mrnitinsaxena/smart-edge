# External alarm panel (e.g. Alarmo). Included by default on non-product builds,
# or on product builds when `alarm_panel_entity` is set.
binary_sensor:
  - platform: template
    name: Home Alarm
    icon: mdi:home-lock
    id: external_alert
    device_class: safety
    lambda: |-
      return id(alarmo_state).has_state() &&
             id(alarmo_state).state == "triggered";

text_sensor:
  - platform: homeassistant
    id: alarmo_state
    entity_id: ${ alarm_panel_entity if alarm_panel_entity is defined and alarm_panel_entity != "" else "alarm_control_panel.alarmo" }
