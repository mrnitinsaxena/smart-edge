switch:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    bluetooth:
      name: ${ld2410_prefix}Bluetooth
    engineering_mode:
      name: ${ld2410_prefix}Engineering mode
select:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    distance_resolution:
      name: ${ld2410_prefix}Distance resolution
    baud_rate:
      name: ${ld2410_prefix}Baud rate
    light_function:
      name: ${ld2410_prefix}Light function
    out_pin_level:
      name: ${ld2410_prefix}Out pin level

button:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    factory_reset:
      name: ${ld2410_prefix}Factory reset
    restart:
      name: ${ld2410_prefix}Restart
    query_params:
      name: ${ld2410_prefix}Query params

text_sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    version:
      name: ${ld2410_prefix}Firmware version
    mac_address:
      name: ${ld2410_prefix}MAC address

sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    light:
      name: ${ld2410_prefix}Light
    moving_distance:
      name: ${ld2410_prefix}Moving Distance
    still_distance:
      name: ${ld2410_prefix}Still Distance
    moving_energy:
      name: ${ld2410_prefix}Move Energy
    still_energy:
      name: ${ld2410_prefix}Still Energy
    detection_distance:
      name: ${ld2410_prefix}Detection Distance
