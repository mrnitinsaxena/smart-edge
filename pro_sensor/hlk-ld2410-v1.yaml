# substitutions:
#   uart_id: "uart_bus_hlk_ld2410"
#   ld2410_id: "hlk_ld2410"
#   ld2410_prefix: "HLK-LD2410 "

uart:
  id: ${uart_id}
  rx_pin: 16
  tx_pin: 17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: ${ld2410_id}
  uart_id: ${uart_id}

binary_sensor:
  - platform: gpio
    name: ${ld2410_prefix}GPIO Out pin presence
    device_class: presence
    pin:
      number: 26
      mode: INPUT_PULLDOWN

  - platform: ld2410
    ld2410_id: ${ld2410_id}
    has_target:
      name: Presence
      device_class: occupancy
    has_moving_target:
      name: Motion
      device_class: motion
    has_still_target:
      name: ${ld2410_prefix}Still Target
    out_pin_presence_status:
      name: ${ld2410_prefix}Out pin presence status

number:
  - platform: ld2410
    ld2410_id: ${ld2410_id}
    timeout:
      name: ${ld2410_prefix}Timeout
    light_threshold:
      name: ${ld2410_prefix}Light threshold
    max_move_distance_gate:
      name: ${ld2410_prefix}Max move distance gate
    max_still_distance_gate:
      name: ${ld2410_prefix}Max still distance gate
