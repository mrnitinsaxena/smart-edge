# Your own (home) units: keep your existing API key so HA stays connected.
# Put real values in secrets.yaml.
substitutions:
  custom_device_name: "living-room"
  custom_friendly_name: "Living Room"
  api_key: !secret smart_edge_api_key        # your current key
  web_username: !secret smart_edge_web_user  # omit both to disable the web UI
  web_password: !secret smart_edge_web_pass
  # alarm_panel_entity: alarm_control_panel.alarmo   # default on home builds
  # improv_ble: false                                 # skip BLE onboarding at home
  ld2410: true
  sensor_mode_uart: true
  ir_samsung_tv: true

packages:
  core: !include ../smart-edge/pro_sensor_2026.11/core.yaml
