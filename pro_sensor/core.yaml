substitutions:
  company: "Resonate to Innovate"
  brand: "Smart Edge"
  device_name: "pro-sensor"
  model: "Pro Sensor"
  hardware_version: "2025.08.19"
  firmware_version: "2026.11.5"
  project_id: "resonate.smart-edge-pro-sensor"

  SDA_I2C_PIN: "21"
  SCL_I2C_PIN: "22"
  BUZZER_PIN: "23"
  WS2812_PIN: "25"
  IR_RECEIVER_PIN: "18"
  IR_TRANSMITTER_PIN: "19"

  sound_one_beep: 'one_short:d=4,o=5,b=100:16e6'
  sound_two_beep: 'two_short:d=4,o=5,b=100:16e6,16e6'
  sound_three_beep: 'three_short:d=4,o=5,b=100:16e6,16e6,16e6'
  sound_on_error: 'long:d=1,o=5,b=100:e6'
  sound_siren: 'siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e,d,e'

  board_reserve_ma: "300"

  ir_capabilities: !include
    file: core-ir.yaml
  ir_tv_select_capabilities: !include
    file: core-ir-tv-select.yaml
  ir_ac_select_capabilities: !include
    file: core-ir-ac-select.yaml
  ir_fan_select_capabilities: !include
    file: core-ir-fan-select.yaml
  wifi_custom_capabilities: !include
    file: core-wifi-custom.yaml
  area_capabilities: !include
    file: core-area.yaml
  api_key_capabilities: !include
    file: core-api-key.yaml
  web_server_capabilities: !include
    file: core-web-server.yaml
  alarm_panel_capabilities: !include
    file: core-alarm-panel.yaml
  improv_ble_capabilities: !include
    file: core-improv-ble.yaml
  dashboard_import_capabilities: !include
    file: core-dashboard-import.yaml
  updates_capabilities: !include
    file: core-updates.yaml
  atomberg_fan_capabilities: !include
    file: ir-atomberg-fan.yaml
  daikin_ac_capabilities: !include
    file: ir-climate-daikin-cool.yaml
  panasonic_ac_capabilities: !include
    file: ir-climate-panasonic-rkr.yaml
  samsung_tv_capabilities: !include
    file: ir-samsung-tv.yaml
  sony_tv_capabilities: !include
    file: ir-sony-tv.yaml

  ld2410_uart_capabilities: !include
    file: hlk-ld2410-uart.yaml
  ld2410_gpio_capabilities: !include
    file: hlk-ld2410-gpio.yaml
  ld2412_capabilities: !include
    file: hlk-ld2412.yaml
  ld2420_uart_capabilities: !include
    file: hlk-ld2420-uart.yaml
  ld2420_gpio_capabilities: !include
    file: hlk-ld2420-gpio.yaml
  ld2450_capabilities: !include
    file: hlk-ld2450.yaml
  sen0395_uart_capabilities: !include
    file: sen0395-uart.yaml
  sen0395_gpio_capabilities: !include
    file: sen0395-gpio.yaml
  sen0609_uart_capabilities: !include
    file: sen0609-uart.yaml
  sen0609_gpio_capabilities: !include
    file: sen0609-gpio.yaml
  mr24hpc1_uart_capabilities: !include
    file: mr24hpc1-uart.yaml
  mr24hpc1_gpio_capabilities: !include
    file: mr24hpc1-gpio.yaml

  presence_sensor_model: ${ (("HLK-LD2410 (UART)" if sensor_mode_uart is defined and sensor_mode_uart else "HLK-LD2410 (GPIO)") if ld2410 is defined and ld2410 else ("HLK-LD2412" if ld2412 is defined and ld2412 else (("HLK-LD2420 (UART)" if sensor_mode_uart is defined and sensor_mode_uart else "HLK-LD2420 (GPIO)") if ld2420 is defined and ld2420 else ("HLK-LD2450" if ld2450 is defined and ld2450 else (("DFRobot SEN0395 (UART)" if sensor_mode_uart is defined and sensor_mode_uart else "DFRobot SEN0395 (GPIO)") if sen0395 is defined and sen0395 else (("DFRobot SEN0609 (UART)" if sensor_mode_uart is defined and sensor_mode_uart else "DFRobot SEN0609 (GPIO)") if sen0609 is defined and sen0609 else (("Seeed MR24HPC1 (UART)" if sensor_mode_uart is defined and sensor_mode_uart else "Seeed MR24HPC1 (GPIO)") if mr24hpc1 is defined and mr24hpc1 else "Not installed"))))))) }


packages:
  core_ir: ${ ir_capabilities if (ir_atomberg_fan is defined and ir_atomberg_fan) or (ir_daikin_ac is defined and ir_daikin_ac) or (ir_panasonic_ac is defined and ir_panasonic_ac) or (ir_samsung_tv is defined and ir_samsung_tv) or (ir_sony_tv is defined and ir_sony_tv) else {} }
  wifi_custom_capabilities: ${ wifi_custom_capabilities if wifi_ssid is defined and wifi_password is defined and wifi_ssid != "" and wifi_password != "" else {} }
  api_key_capabilities: ${ api_key_capabilities if api_key is defined and api_key != "" else {} }
  area_capabilities: ${ area_capabilities if custom_area is defined and custom_area != "" else {} }
  web_server_capabilities: ${ web_server_capabilities if web_username is defined and web_password is defined and web_username != "" and web_password != "" else {} }
  alarm_panel_capabilities: ${ alarm_panel_capabilities if not (alarm_panel is defined and not alarm_panel) else {} }
  improv_ble_capabilities: ${ {} if improv_ble is defined and not improv_ble else improv_ble_capabilities }
  dashboard_import_capabilities: ${ dashboard_import_capabilities if dashboard_import_url is defined and dashboard_import_url != "" else {} }
  updates_capabilities: ${ updates_capabilities if update_manifest_url is defined and update_manifest_url != "" else {} }
  atomberg_fan_capabilities: ${ atomberg_fan_capabilities if ir_atomberg_fan is defined and ir_atomberg_fan else {} }
  daikin_ac_capabilities: ${ daikin_ac_capabilities if ir_daikin_ac is defined and ir_daikin_ac else {} }
  panasonic_ac_capabilities: ${ panasonic_ac_capabilities if ir_panasonic_ac is defined and ir_panasonic_ac else {} }
  samsung_tv_capabilities: ${ samsung_tv_capabilities if ir_samsung_tv is defined and ir_samsung_tv else {} }
  sony_tv_capabilities: ${ sony_tv_capabilities if ir_sony_tv is defined and ir_sony_tv else {} }
  ir_tv_select_capabilities: ${ ir_tv_select_capabilities if (ir_samsung_tv is defined and ir_samsung_tv) or (ir_sony_tv is defined and ir_sony_tv) else {} }
  ir_ac_select_capabilities: ${ ir_ac_select_capabilities if (ir_daikin_ac is defined and ir_daikin_ac) or (ir_panasonic_ac is defined and ir_panasonic_ac) else {} }
  ir_fan_select_capabilities: ${ ir_fan_select_capabilities if ir_atomberg_fan is defined and ir_atomberg_fan else {} }
  ld2412_capabilities: ${ ld2412_capabilities if ld2412 is defined and ld2412 else {} }
  ld2450_capabilities: ${ ld2450_capabilities if ld2450 is defined and ld2450 else {} }
  ld2410_capabilities: ${ ld2410_uart_capabilities if ld2410 is defined and ld2410 and (sensor_mode_uart is defined and sensor_mode_uart) else ld2410_gpio_capabilities if ld2410 is defined and ld2410 else {} }
  ld2420_capabilities: ${ ld2420_uart_capabilities if ld2420 is defined and ld2420 and (sensor_mode_uart is defined and sensor_mode_uart) else ld2420_gpio_capabilities if ld2420 is defined and ld2420 else {} }
  sen0395_capabilities: ${ sen0395_uart_capabilities if sen0395 is defined and sen0395 and (sensor_mode_uart is defined and sensor_mode_uart) else sen0395_gpio_capabilities if sen0395 is defined and sen0395 else {} }
  sen0609_capabilities: ${ sen0609_uart_capabilities if sen0609 is defined and sen0609 and (sensor_mode_uart is defined and sensor_mode_uart) else sen0609_gpio_capabilities if sen0609 is defined and sen0609 else {} }
  mr24hpc1_capabilities: ${ mr24hpc1_uart_capabilities if mr24hpc1 is defined and mr24hpc1 and (sensor_mode_uart is defined and sensor_mode_uart) else mr24hpc1_gpio_capabilities if mr24hpc1 is defined and mr24hpc1 else {} }

time:
  - platform: homeassistant
    timezone: ${ "Asia/Kolkata" if timezone is not defined or timezone == "" else timezone }

ota:
  - platform: esphome
    id: ota_esphome

factory_reset:
  resets_required: 5
  max_delay: 10s

captive_portal:

debug:

output:
  - platform: ledc
    pin: ${BUZZER_PIN}
    id: buzzer_ledc

rtttl:
  output: buzzer_ledc
  id: buzzer
  gain: 0.6
  on_finished_playback:
    - if:
        condition:
          - binary_sensor.is_on: safety_alert
        then:
          - delay: 1ms 
          - rtttl.play:
              id: buzzer
              rtttl: ${sound_siren}
logger:
  level: ${ "WARN" if logger_level is not defined or logger_level == "" else logger_level }
  baud_rate: ${ 0 if (usb_logs is defined and not usb_logs) else 115200 }

esphome:
  name: ${ device_name if custom_device_name is not defined or custom_device_name == "" else custom_device_name }
  friendly_name: ${ model if custom_friendly_name is not defined or custom_friendly_name == "" else custom_friendly_name }
  name_add_mac_suffix: ${ false if custom_device_name is defined or custom_friendly_name is defined else true }
  project:
    name: ${project_id}
    version: ${firmware_version}
  on_boot:
    - priority: -100
      then:
        - script.execute: apply_led_cap
        - if:
            condition:
              switch.is_off: dnd
            then:
              - light.turn_on:
                  id: notification_light
                  effect: info
                  brightness: 50%
                  red: 0%
                  green: 100%
                  blue: 0%
              - delay: 500ms
              - rtttl.play:
                  rtttl: ${sound_one_beep}
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: model
            state: "${model}"
        - text_sensor.template.publish:
            id: hardware_version
            state: ${hardware_version}
        - text_sensor.template.publish:
            id: firmware_version
            state: ${firmware_version}
        - text_sensor.template.publish:
            id: presence_sensor
            state: ${presence_sensor_model}
        - text_sensor.template.publish:
            id: company
            state: ${company}
        - text_sensor.template.publish:
            id: brand
            state: ${brand}

esp32:
  board: "esp32dev"
  cpu_frequency: ${ "240MHz" if cpu_frequency_mode is not defined or cpu_frequency_mode in ("", "NONE") else "160MHz" if cpu_frequency_mode == "LIGHT" else "80MHz" }
  framework:
    type: "esp-idf"
    version: "recommended"
    advanced:
      minimum_chip_revision: "3.1"

i2c:
  sda: ${SDA_I2C_PIN}
  scl: ${SCL_I2C_PIN}
  scan: true
  id: i2c_bus

wifi:
  min_auth_mode: WPA2
  power_save_mode: ${ "NONE" if (wifi_power_mode is not defined or  wifi_power_mode in ("", "NONE")) else "LIGHT" if wifi_power_mode == "LIGHT" else "HIGH" }
  ap: {}
  on_connect:
    if:
      condition:
        not:
          - binary_sensor.is_on: safety_alert
      then:
        - if:
            condition:
              switch.is_off: dnd
            then:
              - light.turn_on:
                  id: notification_light
                  effect: info
                  brightness: 50%
                  red: 0%
                  green: 0%
                  blue: 100%
              - rtttl.play:
                  rtttl: ${sound_two_beep}
  on_disconnect:
    if:
      condition:
        not:
          - binary_sensor.is_on: safety_alert
      then:
        - if:
            condition:
              switch.is_off: dnd
            then:
              - light.turn_on:
                  id: notification_light
                  brightness: 50%
                  effect: error
                  red: 0%
                  green: 100%
                  blue: 0%
              - rtttl.play:
                  rtttl: ${sound_on_error}

api:
  homeassistant_states: true
  reboot_timeout: 0s
  encryption: {}
  on_client_connected:
    if:
      condition:
        not:
          - binary_sensor.is_on: safety_alert
      then:
        - if:
            condition:
              light.is_on: notification_light
            then:
              - light.turn_off:
                  id: notification_light
        - if:
            condition:
              switch.is_off: dnd
            then:
              - rtttl.play:
                  rtttl: ${sound_three_beep}
  on_client_disconnected:
    if:
      condition:
        not:
          - binary_sensor.is_on: safety_alert
      then:
        - if:
            condition:
              switch.is_off: dnd
            then:
              - light.turn_on:
                  id: notification_light
                  brightness: 50%
                  effect: error
                  red: 0%
                  green: 0%
                  blue: 100%
              - rtttl.play:
                  rtttl: ${sound_on_error}

binary_sensor:
  - platform: status
    name: "Home Assistant"
    id: ha_api_connected
    icon: mdi:api
    device_class: connectivity

  - platform: template
    name: ${ "High temperature alert" if product_build is defined and product_build else "Fire alert" }
    id: internal_alert
    icon: ${ "mdi:thermometer-alert" if product_build is defined and product_build else "mdi:fire" }
    device_class: heat
    lambda: |-
      return id(sensor_temperature).has_state() &&
             id(fire_threshold_temperature).has_state() &&
             id(sensor_temperature).state >= id(fire_threshold_temperature).state;
    filters:
      - delayed_off: 10s

  - platform: template
    name: "Safety alert"
    id: safety_alert
    icon: mdi:exit-run
    device_class: safety
    lambda: 'return id(internal_alert).state || id(external_alarm).state${ " || id(external_alert).state" if not (alarm_panel is defined and not alarm_panel) else "" };'
    on_press:
      then:
        - light.turn_on:
            id: notification_light
            effect: emergency
            brightness: 100%
        - if:
            condition:
              rtttl.is_playing:
            then:
              - rtttl.stop:
            else:
              - rtttl.play:
                  rtttl: ${sound_siren}
    on_release:
      then:
        - if:
            condition:
              rtttl.is_playing:
            then:
              - rtttl.stop:
        - if:
            condition:
              light.is_on: notification_light
            then:
              - light.control:
                  id: notification_light
                  state: off
                  brightness: 25%
                  effect: None

switch:
  - platform: template
    name: "External alarm"
    id: external_alarm
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: factory_reset
    name: Factory reset
    id: device_reset
    entity_category: config
    
  - platform: restart
    name: Restart
    id: device_restart
    entity_category: config

  - platform: template
    name: "Do Not Disturb"
    id: dnd
    icon: mdi:minus-circle
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: internal_temperature
    name: CPU Temperature

  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic

  - platform: uptime
    type: timestamp
    name: Uptime

  - platform: bh1750
    i2c_id: i2c_bus
    address: 0x23
    name: Illuminance
    id: sensor_illuminance
    filters:
      - lambda: |-
          return x + id(sensor_illuminance_offset).state;

  - platform: aht10
    variant: AHT20
    temperature:
      name: Temperature
      id: sensor_temperature
      filters:
        - lambda: |-
            return x + id(sensor_temperature_offset).state;
    humidity:
      name: Humidity
      id: sensor_humidity
      filters:
        - lambda: |-
            return x + id(sensor_humidity_offset).state;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
      id: ip_address
      icon: mdi:ip-network
      entity_category: diagnostic
    ssid:
      name: Connected WiFi
      id: wifi_ssid
      icon: mdi:access-point-network
      entity_category: diagnostic
    mac_address:
      name: Mac address
      id: mac_address
      icon: mdi:lan
      entity_category: diagnostic

  - platform: debug
    device:
      name: "Device Info"
      internal: true

  - platform: template  
    name: Company
    id: company
    icon: mdi:domain
    entity_category: diagnostic

  - platform: template  
    name: Brand
    id: brand
    icon: mdi:domain-switch
    entity_category: diagnostic

  - platform: template  
    name: Model
    id: model
    icon: mdi:archive-check-outline
    entity_category: diagnostic

  - platform: template  
    name: Presence sensor
    id: presence_sensor
    icon: mdi:motion-sensor
    entity_category: diagnostic

  - platform: template  
    name: Hardware version
    id: hardware_version
    icon: mdi:tag-check-outline
    entity_category: diagnostic

  - platform: template
    name: Firmware version
    id: firmware_version
    icon: mdi:tag-check-outline
    entity_category: diagnostic


number:
  - platform: template
    name: ${ "High temperature threshold" if product_build is defined and product_build else "Fire threshold temperature" }
    id: fire_threshold_temperature
    optimistic: true
    restore_value: true
    min_value: 30
    max_value: 85
    step: 1
    initial_value: 55
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines
    entity_category: config

  - platform: template
    name: Temperature Offset
    id: sensor_temperature_offset
    optimistic: true
    restore_value: true
    min_value: -20
    max_value: 20
    step: 0.1
    initial_value: -1.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines
    entity_category: config

  - platform: template
    name: Humidity Offset
    id: sensor_humidity_offset
    optimistic: true
    restore_value: true
    min_value: -20
    max_value: 20
    step: 0.1
    initial_value: -5
    unit_of_measurement: "%"
    icon: mdi:water-percent
    entity_category: config

  - platform: template
    name: Illuminance Offset
    id: sensor_illuminance_offset
    optimistic: true
    restore_value: true
    min_value: -500
    max_value: 500
    step: 10
    initial_value: 0
    unit_of_measurement: "lx"
    icon: mdi:brightness-auto
    entity_category: config

select:
  - platform: template
    name: "Power supply"
    id: power_supply_select
    icon: mdi:power-plug
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "0.5 A"      # computer USB port
      - "1 A"        # HLK-5M05 / small USB charger
      - "2 A"
      - "3 A"
      - "5 A"        # external strip supply
    initial_option: "1 A"
    on_value:
      then:
        - script.execute: apply_led_cap

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: ${ external_ws2812_pin if external_ws2812_pin is defined and external_ws2812_pin != WS2812_PIN else WS2812_PIN }
    num_leds: ${ external_ws2812_num_led if external_ws2812_num_led is defined and external_ws2812_num_led != 1 else 1 }
    chipset: ws2812  
    id: notification_light
    name: Notification light
    icon: mdi:led-strip-variant
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "emergency"
          update_interval: 60ms
          lambda: |-
            static uint8_t step = 0;
            if (initial_run) step = 0;               // start pattern fresh each time
            const int n = it.size();
            const Color red(255, 0, 0);
            const Color blue(0, 0, 255);
            const bool on    = (step % 2 == 0);      // flash on/off every 60 ms
            const bool first = (step < 6);           // first 3 flashes red, next 3 blue
            it.all() = Color::BLACK;

            if (on) {
              if (n == 1) {
                it.all() = first ? red : blue;       // single LED: red x3, blue x3
              } else if (first) {
                it.range(0, n / 2) = red;            // left half red x3
              } else {
                it.range(n / 2, n) = blue;           // right half blue x3
              }
            }
            step = (step + 1) % 12;
      - pulse:
          name: "info"
          update_interval: 2s
          min_brightness: 15%
          max_brightness: 80%
          transition_length:
            on_length: 500ms
            off_length: 1.5s
      - pulse:
          name: "warning"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 80%
      - pulse:
          name: "error"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 15%
          max_brightness: 80%
      - pulse:
          name: "alert"
          transition_length: 0.25s
          update_interval: 0.25s
          min_brightness: 15%
          max_brightness: 100%
    on_state:
      then:
        - script.execute: apply_led_cap

script:
  - id: apply_led_cap
    mode: queued
    then:
      - lambda: |-
          auto *out = static_cast<light::AddressableLight *>(id(notification_light)->get_output());

          // Full brightness only while the "emergency" effect is running
          if (id(notification_light)->get_effect_name() == "emergency") {
            out->set_correction(1.0f, 1.0f, 1.0f);
            ESP_LOGW("power", "Emergency effect: LED cap removed (100%%)");
            return;
          }

          // Everything else: cap to the selected supply
          static const float supply_ma[] = {500, 1000, 2000, 3000, 5000};   // same order as options
          auto idx = id(power_supply_select).active_index();
          const float supply = idx.has_value() ? supply_ma[idx.value()] : 1000.0f;

          const float n = out->size();
          const float budget = supply - ${board_reserve_ma} - n * 1.0f;
          const float c = std::max(0.05f, std::min(1.0f, budget / (n * 60.0f)));
          out->set_correction(c, c, c);
          ESP_LOGI("power", "Supply %.0f mA, %d LEDs, cap %.0f%%", supply, (int) n, c * 100);