# Smart Edge Pro Sensor - entry point used by the ESPHome dashboard "Adopt" button
# and by the GitHub Action that publishes firmware updates.
substitutions:
  product_build: true
  # IR remotes: all brands built in; the user picks theirs in Home Assistant
  ir_samsung_tv: true
  ir_sony_tv: true
  ir_daikin_ac: true
  ir_panasonic_ac: true
  ir_atomberg_fan: true
  dashboard_import_url: github://mrnitinsaxena/smart-edge/pro-sensor.yaml@v${firmware_version}
  update_manifest_url: https://mrnitinsaxena.github.io/smart-edge/pro-sensor/manifest.json

packages:
  core: !include pro_sensor_2026.11/core.yaml
