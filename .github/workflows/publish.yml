name: Publish firmware

on:
  release:
    types: [published]

permissions:
  contents: write   # attach binaries to the release
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: pro-sensor.yaml
          complete-manifest: true
          release-summary: ${{ github.event.release.body }}
          release-url: ${{ github.event.release.html_url }}
          substitutions: |
            firmware_version=${{ steps.ver.outputs.version }}

      - name: Assemble site
        run: |
          mkdir -p site/pro-sensor
          cp -r "${{ steps.esphome.outputs.name }}"/* site/pro-sensor/
          cp static/index.html site/
          ls -R site

      - name: Set product name shown in Home Assistant
        run: |
          jq '.name = "Resonate to Innovate: Smart Edge Pro Sensor"' site/pro-sensor/manifest.json > manifest.tmp
          mv manifest.tmp site/pro-sensor/manifest.json
          cat site/pro-sensor/manifest.json

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" site/pro-sensor/*.bin --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
